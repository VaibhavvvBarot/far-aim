# Every night: check the eCFR and FAA for new text, commit any changes
# (with word-level diffs), rebuild the app and publish it to GitHub Pages.
name: Nightly update and publish

on:
  schedule:
    - cron: '17 9 * * *' # 03:17 Mountain time (09:17 UTC)
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild all regulation data even if nothing changed'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Fetch regulations, AIM and glossary
        if: github.event_name != 'push'
        run: node scripts/build-data.mjs ${{ inputs.force && '--force' || '' }}

      - name: Commit data changes
        if: github.event_name != 'push'
        run: |
          if [ -n "$(git status --porcelain public)" ]; then
            git config user.name "far-aim-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public
            git commit -m "Data update $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No data changes."
          fi

      - name: Build app
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
